services:
  - type: worker
    name: image-generator-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: FAL_KEY
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DB_PATH
        value: /data/bot_data.db
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
